name: Auto-seed SkillsMaps to Production

on:
    push:
        branches: [main]
        paths:
            - "apps/backend/src/db/seeds/modules_v3/**"
            - "apps/backend/src/db/seeds/skillsmaps/**"

jobs:
    seed:
        name: Seed SkillsMaps to Production DB
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  cd apps/backend
                  pip install sqlalchemy psycopg2-binary python-dotenv

            - name: Validate module imports
              run: |
                  cd apps/backend
                  python -c "
                  import sys
                  sys.path.insert(0, '.')
                  from src.db.seeds.modules_v3 import get_all_modules, get_module_count, get_total_tasks
                  print('=' * 60)
                  print('SKILLSMAPS VALIDATION')
                  print('=' * 60)
                  print(f'Modules: {get_module_count()}')
                  print(f'Tasks: {get_total_tasks()}')
                  print()
                  for m in get_all_modules():
                      task_count = len(m.get('tasks', []))
                      print(f'  ✅ {m[\"name\"]}: {task_count} tasks')
                  print('=' * 60)
                  print('All modules validated successfully!')
                  "

            - name: Seed to production database
              if: github.ref == 'refs/heads/main'
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "⚠️ DATABASE_URL not set, skipping seed"
                    exit 0
                  fi
                  cd apps/backend
                  python scripts/seed_tasks_to_prod.py

            - name: Summary
              run: |
                  echo "## SkillsMaps Seed Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Modules validated and seeded to production" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Trigger: Push to \`main\` with changes in:" >> $GITHUB_STEP_SUMMARY
                  echo "- \`apps/backend/src/db/seeds/modules_v3/**\`" >> $GITHUB_STEP_SUMMARY
                  echo "- \`apps/backend/src/db/seeds/skillsmaps/**\`" >> $GITHUB_STEP_SUMMARY
