[build]
  command = "npm ci && npm run build --workspace=frontend"
  publish = "apps/frontend/.next"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://api.ginonova.com"
  NPM_FLAGS = "--include=optional"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
