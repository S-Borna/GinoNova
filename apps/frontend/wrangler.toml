# Cloudflare Pages Configuration
name = "saas-project"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext output directory for Pages (relative to this wrangler.toml)
pages_build_output_dir = ".open-next"

[vars]
NEXT_PUBLIC_API_URL = "https://api.ginonova.com"

# Environment-specific vars
[env.production.vars]
NEXT_PUBLIC_API_URL = "https://api.ginonova.com"

[env.preview.vars]
NEXT_PUBLIC_API_URL = "https://api.ginonova.com"
